<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ── Primary SEO ── -->
  <title>YourName — Flutter Developer</title>
  <meta name="description"
    content="Flutter developer specialising in high-performance cross-platform mobile applications. Available for freelance projects.">
  <meta name="keywords"
    content="Flutter developer, Dart, mobile app development, cross-platform, Firebase, Riverpod">
  <meta name="author" content="YourName">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yourname.me/">

  <!-- ── Open Graph (WhatsApp, Facebook, LinkedIn previews) ── -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yourname.me/">
  <meta property="og:title" content="YourName — Flutter Developer">
  <meta property="og:description"
    content="Flutter developer specialising in high-performance cross-platform mobile applications.">
  <meta property="og:image" content="https://yourname.me/icons/og-image.png">

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://yourname.me/">
  <meta name="twitter:title" content="YourName — Flutter Developer">
  <meta name="twitter:description"
    content="Flutter developer specialising in high-performance cross-platform mobile apps.">
  <meta name="twitter:image" content="https://yourname.me/icons/og-image.png">

  <!-- ── Icons ── -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- ── Theme colour (browser chrome on mobile) ── -->
  <meta name="theme-color" content="#101415">
  <meta name="msapplication-navbutton-color" content="#101415">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- ── Font preconnect (reduces FOUT) ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- ── Flutter bootstrap ── -->
  <script src="flutter_bootstrap.js" async></script>

  <style>
    /* Hide scrollbar during Flutter load */
    body {
      background-color: #101415;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      background: #101415;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-ring {
      width: 48px;
      height: 48px;
      border: 2px solid rgba(0, 180, 255, 0.15);
      border-top-color: #00b4ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .loader-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.15em;
      color: rgba(189, 200, 210, 0.6);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    ::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #101415; }
::-webkit-scrollbar-thumb {
  background: #3e4851;
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover { background: #00b4ff; }

/* Text selection */
::selection {
  background: rgba(0, 180, 255, 0.25);
  color: #e0e3e5;
}
  </style>
</head>

<body>
  <!-- Loading screen — hidden once Flutter renders -->
  <div id="loading">
    <div class="loader-ring"></div>
    <div class="loader-name">INITIALISING...</div>
  </div>

  <script>
    // Hide loading screen once Flutter first frame is drawn
    window.addEventListener('flutter-first-frame', () => {
      const loader = document.getElementById('loading');
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 600);
      document.body.style.overflow = '';
    });
  </script>
</body>
</html>
