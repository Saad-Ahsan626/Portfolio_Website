name: portfolio
description: Personal portfolio of Muhammad Saad Ahsan, Full-Stack Mobile Engineer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing (shareable case-study URLs)
  go_router: ^17.5.0

  # Animations
  flutter_animate: ^4.5.0

  # Fonts
  google_fonts: ^6.2.1

  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/saad.jpg
    - assets/images/background.webp
    - assets/images/workspace.webp
    - assets/projects-images/

  fonts:
    # Subset of Simple Icons (CC0) — see lib/core/theme/brand_icons.dart
    - family: BrandIcons
      fonts:
        - asset: assets/fonts/BrandIcons.ttf
